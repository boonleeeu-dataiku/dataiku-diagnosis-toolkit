# Expected checklist-review results for bundles/synthetic_design_baseline, reviewed against
# checklists/eval_checklist.xlsx. Maintained by hand: each entry encodes one calibration or
# evidence rule from skills/dataiku-diagnosis-checklist-review/SKILL.md.
#
# Per item:
#   status        allowed validation_status values (any one passes)
#   mentions      every string must appear in evidence_found + notes (case-insensitive)
#   mentions_any  at least one string must appear in evidence_found + notes
#   matches       regex that must match evidence_found + notes (case-insensitive)

bundle: bundles/synthetic_design_baseline
items:
  ARCH-001:   # automation-node calibration: design bundle is never Pass/Fail; populated deployer highlighted
    status: [Needs Review]
    mentions: [project-deployer]
    mentions_any: [automation.synthetic.example, prod-automation]
  ARCH-002:   # 12.x is behind any current GA major, with or without a web lookup
    status: [Needs Review]
    mentions: ["12.6"]
  ARCH-004:   # DSS's own sanity check flags a rotational disk -> authoritative
    status: [Fail]
    mentions: [sanity-check]
  ARCH-010:   # no Kubernetes cluster attached -> Not Applicable, not Fail/Needs Review
    status: [Not Applicable]
  ARCH-013:
    status: [Not Applicable]
  SEC-004:    # cgroups disabled entirely
    status: [Fail]
    mentions: [cgroup]
  SEC-006:    # plain HTTP in install.ini -> Needs Review (reverse proxy can't be ruled out)
    status: [Needs Review]
    mentions: [proxy]
  SCALE-007:  # ERROR entries in backend.log -> Needs Review (never Fail/Partial)
    status: [Needs Review]
    mentions: [backend.log]
  SCALE-008:  # 2g heap on a 64GB host; sizing judgement varies
    status: [Fail, Partial, Needs Review]
    mentions_any: [xmx, 2g]
  SCALE-009:  # unlimited concurrency + OOM evidence -> causal chain called out
    status: [Fail, Partial]
    mentions_any: [SEC-004, SCALE-007, SCALE-008, hs_err, OutOfMemory, oom]
  SCALE-011:
    status: [Fail]
    mentions: [filesystem_root]
  ADVSEC-003: # both session timeouts are 0 (unlimited) in the baseline; finite in the healthy bundle
    status: [Fail]
  ADVSEC-006: # no custom post-logout redirect configured
    status: [Not Applicable]
  ARCH-008:   # no Kubernetes cluster attached -> Not Applicable
    status: [Not Applicable]
  GENAI-001:  # a non-internal code env is the RAG default -> Needs Review
    status: [Needs Review]
    mentions: [custom_rag_env]
  GENAI-009:  # no Agent Hub installed -> Not Applicable
    status: [Not Applicable]
  SEC-002:    # UIF disabled -> Fail
    status: [Fail]
  ADVSEC-008: # no export-restriction key set -> Fail
    status: [Fail]
  ADVSEC-009: # no security headers configured in DSS -> Fail
    status: [Fail]
  SCALE-001:  # PostgreSQL, but on loopback -> Partial
    status: [Partial]
    mentions_any: [127.0.0.1, loopback, local]
    mentions: [rotate]   # plaintext internal DB password -> the rotate Action
  SCALE-002:  # Hive metastore on a Hadoop estate -> Pass without a functional test
    status: [Pass]
  SCALE-003:  # graphics export off -> Needs Review (ask if intentional)
    status: [Needs Review]
  SCALE-004:  # no admin project or cleanup scenario -> Fail
    status: [Fail]
  ARCH-006:   # no Spark execution configs -> Fail
    status: [Fail]
  GENAI-007:  # DSS 12.6 predates the check's minimum version -> Needs Review, never Not Applicable
    status: [Needs Review]
    mentions_any: ["12.6", version]
  SEC-001:    # instance id present in install.ini -> Pass
    status: [Pass]
    mentions_any: [installid, install id, instance id]
  SEC-009:    # LDAP enabled but authorized groups empty -> Fail
    status: [Fail]
    mentions_any: [authorizedGroups, authorized groups]
  ARCH-003:   # RHEL 9.4 on DSS 12.x: listed/not listed depends on the lookup; never guess
    status: [Pass, Fail, Needs Review]
    mentions: ["9.4"]
  SEC-005:    # cgroups block present, no JEK target -> Pass
    status: [Pass]
  GENAI-005:  # no BYO settings -> Not Applicable
    status: [Not Applicable]
  GENAI-006:
    status: [Not Applicable]
  SCALE-006:  # sanity-check output present -> Pass
    status: [Pass]
  SEC-010:    # no ssoSettings in the bundle -> Needs Review (settings missing)
    status: [Needs Review]
    mentions_any: [sso]
  SCALE-010:  # non-blank default upload connection -> Needs Review (ask whether a use case justifies it)
    status: [Needs Review]
    mentions_any: [filesystem_managed, preferedUploadConnection, upload connection]
